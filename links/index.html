<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonho dá Sorte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#1A0938;
    --text-primary:#F3ECFF;
    --text-secondary:#C6B3EC;
    --accent:#F8D92A;
    --sparkle:#FFCF3F;
    --card-bg:rgba(255,255,255,0.06);
    --card-border:rgba(162,89,255,0.4);
    --cta-text:#3D0F6B;
    --social-border:#7C3E96;
    --footer:rgba(198,179,236,0.6);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-base);}
  body{
    font-family:'Figtree',system-ui,sans-serif;
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    position:relative;
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:radial-gradient(120% 80% at 50% -10%, #4A1A8F 0%, #2D0F5E 45%, #1A0938 100%);
    overflow:hidden;
  }
  /* ambient glow */
  .glow{
    position:absolute;
    width:384px;height:384px;
    left:50%;top:96px;transform:translateX(-70%);
    background:radial-gradient(70.71% 70.71% at 50% 50%, #A259FF 0%, rgba(162,89,255,0) 70%);
    opacity:0.4;filter:blur(64px);pointer-events:none;
  }
  .sparkle{position:absolute;color:var(--sparkle);pointer-events:none;filter:drop-shadow(0 0 11px rgba(255,207,63,0.7));}
  .sparkle svg{display:block;width:100%;height:100%}
  .s1{width:10px;height:10px;left:12%;top:11%;opacity:.56}
  .s2{width:16px;height:16px;left:82%;top:19%;opacity:.99}
  .s3{width:7px;height:7px;left:46%;top:36%;opacity:.31}
  .s4{width:7px;height:7px;left:18%;top:80%;opacity:.28}

  .content{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    padding:64px 24px 40px;
  }
  .logo{width:120px;height:auto;display:block}
  .wordmark{
    margin-top:12px;text-align:center;line-height:.92;
  }
  .wordmark .l1{font-weight:600;font-size:34px;letter-spacing:-.5px}
  .wordmark .l2{font-weight:800;font-size:34px;letter-spacing:-.5px}
  .wordmark .l2 .da{font-weight:500;font-size:20px;vertical-align:baseline;margin-right:2px}
  .slogan{
    margin-top:24px;font-size:18px;font-weight:500;color:var(--text-secondary);
  }
  .slogan b{color:var(--text-primary);font-weight:700}

  .pill{
    margin-top:20px;
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 16px;
    background:rgba(248,217,42,0.14);
    border:1px solid rgba(248,217,42,0.5);
    border-radius:999px;
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px #7ED957;}
  .pill span{font-weight:700;font-size:12px;letter-spacing:.3px;color:var(--accent);}

  .nav{width:100%;margin-top:32px;display:flex;flex-direction:column;gap:14px;}

  .link{
    display:flex;align-items:center;gap:16px;
    padding:16px;border-radius:var(--radius);
    text-decoration:none;color:inherit;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .link:active{transform:scale(.985)}
  .link .body{flex:1;min-width:0}
  .link .title{font-weight:700;font-size:15px}
  .link .sub{font-weight:500;font-size:12px;margin-top:4px}
  .link .arrow{font-size:18px;line-height:1;opacity:.9;flex:none}

  .link.primary{
    background:linear-gradient(100deg, #C7EC4E 6%, #ACE019 94%);
    box-shadow:0 10px 30px rgba(255,184,0,0.35);
  }
  .link.primary .title{color:var(--cta-text)}
  .link.primary .sub{color:rgba(61,15,107,0.7)}
  .link.primary .arrow{color:var(--cta-text)}
  .link.primary:hover{box-shadow:0 14px 38px rgba(255,184,0,0.5)}

  .link.secondary{
    background:var(--card-bg);
    border:1px solid var(--card-border);
  }
  .link.secondary .title{color:var(--text-primary)}
  .link.secondary .sub{color:var(--text-secondary)}
  .link.secondary .arrow{color:var(--text-primary)}
  .link.secondary:hover{background:rgba(255,255,255,0.10);border-color:rgba(162,89,255,0.7)}

  .card{
    background:var(--card-bg);border:1px solid var(--card-border);
    border-radius:var(--radius);padding:16px;
  }
  .card .title{font-weight:700;font-size:15px;color:var(--text-primary)}
  .stores{display:flex;gap:14px;margin-top:14px}
  .store{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    height:42px;background:#000;border:1px solid #A6A6A6;border-radius:8px;
    text-decoration:none;color:#fff;font-weight:600;font-size:13px;
    transition:transform .15s ease,border-color .15s ease;
  }
  .store:hover{border-color:#fff}
  .store:active{transform:scale(.97)}
  .store svg{flex:none}

  .socials{display:flex;gap:12px;margin-top:32px;justify-content:center;flex-wrap:wrap}
  .social{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card-bg);border:1px solid var(--social-border);
    color:var(--text-secondary);text-decoration:none;
    transition:transform .15s ease,color .15s ease,border-color .15s ease,background .15s ease;
  }
  .social:hover{color:#fff;border-color:#A259FF;background:rgba(162,89,255,0.18)}
  .social:active{transform:scale(.92)}
  .social svg{width:22px;height:22px;display:block}

  .footer{margin-top:32px;text-align:center;font-size:12px;line-height:16px;color:var(--footer);}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
  @media (max-width:400px){.content{padding:48px 20px 32px}}
</style>
</head>
